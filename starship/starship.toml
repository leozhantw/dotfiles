# Prompt
add_newline = true

# Right prompt
right_format = '$kubernetes'

# Hide gcloud account
[gcloud]
disabled = true

# Kubernetes
[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '
style = 'cyan'

# Git
[git_branch]
symbol = ' '

[git_status]
format = '([$all_status$ahead_behind]($style) )'

# Directory
[directory]
truncation_length = 5
truncate_to_repo = false

# Command duration
[cmd_duration]
min_time = 2_000
format = '[$duration]($style) '
